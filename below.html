<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Below</title>
    <link rel="stylesheet" type="text/css" href="below.css" />
    <script type="text/javascript" src="gamedata.js" defer></script>
    <script type="text/javascript" src="below.js" defer></script>
</head>
<body>
    <div class="title-container" id="titleScreen">
        <div class="below-title">Below</div>
        <div class="below-front-menu-item" id="newGameBtn">New Game</div>
        <div class="below-front-menu-item" id="resumeGameBtn">Continue</div>
    </div>
    <div class="title-container" id="characterSelectDiv" style="display: none;">
        <div class="below-title">Choose Character</div>
        <div class="below-front-menu-item" data-character="boy" onclick="selectCharacter('boy')">Boy</div>
        <div class="below-front-menu-item" data-character="girl" onclick="selectCharacter('girl')">Girl</div>
    </div>
    <div class="" id="cutSceneDiv" style="display: none;">
        Cut scene!
    </div>
    <div class="title-container" id="newGameDiv" style="display: none;">
        <div class="below-front-menu-item" data-slot="0" onclick="startNewGame(0)">Slot 1</div>
        <div class="below-front-menu-item" data-slot="1" onclick="startNewGame(1)">Slot 2</div>
        <div class="below-front-menu-item" data-slot="2" onclick="startNewGame(2)">Slot 3</div>
    </div>
    <div class="title-container" id="resumeGameDiv" style="display: none;">
        <div class="below-front-menu-item" data-slot="0" onclick="continueGame(0)">Slot 1</div>
        <div class="below-front-menu-item" data-slot="1" onclick="continueGame(1)">Slot 2</div>
        <div class="below-front-menu-item" data-slot="2" onclick="continueGame(2)">Slot 3</div>
    </div>
    <div class="below-game-container" id="gameDiv" style="display: none;">
        <div class="below-game-left-panel">
            <div class="area-description" id="areaDescriptionDiv"></div>
            <div class="below-game-log" id="gameLogDiv"></div>
        </div>
        <div class="below-game-center-panel" id="gameDivCenter">
            <canvas class="map-canvas" id="mapCanvas"></canvas>
            <div id="saveStatus" style="position: absolute; bottom: 10px; right: 10px; font-size: 0.8em; color: #666;"></div>
            <div class="controls-hint">Arrow keys/WASD: Move | Enter: Interact | Q: Inventory | Esc: Back</div>
            <div style="position: absolute; top: 10px; right: 10px;">
                <button onclick="exportSave()" style="font-size: 0.8em;">Export Save</button>
                <button onclick="importSave()" style="font-size: 0.8em;">Import Save</button>
            </div>
        </div>
        <div class="inventory-outer" id="inventoryDiv" style="display: none;">
        <div class="inventory-inner">
            <h2>Inventory</h2>
            <table class="inventory-table" id="inventoryTable">
            </table>
        </div>
    </div>
    <div class="splash-overlay" id="splashOverlay" style="display:none;">
      <div class="splash-content" id="splashContent">
        <img id="splashImage" class="splash-image" src="">
        <p id="splashText" class="splash-text"></p>
        <button class="splash-btn" id="splashBtn">Continue</button>
      </div>
    </div>
</body>
</html>
